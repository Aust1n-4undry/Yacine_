<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking</title>

    <link rel="stylesheet" href="../style/main.css">
    <link rel="stylesheet" href="../style/forms.css">
</head>
<body>

<header>
    <nav class="navbar">
        <div class="logo">🚀 Galaxy Escape</div>

        <ul class="nav-links">
            <li><a href="../index.html">Home</a></li>
            <li><a href="products.html">Trips</a></li>
            <li><a href="register.html">Register</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="booking.html">Booking</a></li>
        </ul>
    </nav>
</header>

<main>
    <section class="form-section">

        <form id="bookingForm" class="form-container">
            <h2>Book Your Space Trip</h2>

            <input type="text" id="traveler" placeholder="Traveler Name">

            <select id="destination">
                <option value="">Choose Destination</option>
                <option value="Moon">Moon</option>
                <option value="Mars">Mars</option>
                <option value="Orbital Hotel">Orbital Hotel</option>
                <option value="Earth Orbit Cruise">Earth Orbit Cruise</option>
            </select>

            <input type="date" id="travelDate">

            <input type="number" id="travelersCount" placeholder="Number of Travelers">

            <button type="submit">Reserve Now</button>

            <p id="bookingMessage"></p>
        </form>

    </section>
</main>

<script src="../javascript/booking.js"></script>

</body>
</html>
